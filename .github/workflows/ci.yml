name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Линт, тесты и сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (с подмодулем llama.cpp)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (с кэшем)
        uses: gradle/actions/setup-gradle@v4

      # AGP требует ровно ту версию CMake, что указана в llamacpp/build.gradle.kts.
      - name: CMake 3.31.6 из Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6"

      - name: Линт и юнит-тесты
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Release APK (без подписи — проверка сборки)
        run: ./gradlew --no-daemon assembleRelease

      - name: Артефакт — debug APK (готов к установке)
        uses: actions/upload-artifact@v7
        with:
          name: aigate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Отчёты (при падении)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
